name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test SSH connection
        if: ${{ secrets.VM_HOST != '' && secrets.VM_USER != '' && secrets.VM_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            echo "SSH connection successful"
            hostname
            docker --version

      - name: Skip deploy check when SSH secrets are not configured
        if: ${{ secrets.VM_HOST == '' || secrets.VM_USER == '' || secrets.VM_PASSWORD == '' }}
        run: echo "Skipping SSH deploy check because VM_HOST, VM_USER, or VM_PASSWORD is not configured."
